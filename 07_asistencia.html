<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Asistencia | TallerControl</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/07_asistencia.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<main class="asistencia">

    <!-- Luces -->

    <div class="luz luz-1"></div>
    <div class="luz luz-2"></div>

    <!-- Encabezado -->

    <header class="encabezado">

    <div class="titulo">

        <a href="02_inicio.html">
            <i data-lucide="arrow-left"></i>
        </a>

        <h1>Asistencia</h1>

    </div>

    <div class="usuario-box">

        <div class="usuario-info">

            <i data-lucide="user"></i>

            <span id="nombreUsuario"></span>

        </div>

        <button
            id="cerrarSesion"
            class="btn-salir">

            Salir

        </button>

    </div>

</header>

    <!-- Fecha -->

    <section class="fecha-asistencia">

        <label for="fecha">

            Fecha

        </label>

        <input
            type="date"
            id="fecha"
            name="fecha">

    </section>

    <!-- Filtros -->

<section class="filtros">

    <div class="campo">

        <label>Año</label>

        <select id="anio">

            <option>Seleccione...</option>

        </select>

    </div>

    <div class="campo">

        <label>Grupo</label>

        <select id="grupo">

            <option>Seleccione...</option>

        </select>

    </div>

    <div class="campo">

        <label>Taller</label>

        <select id="taller">

            <option>Seleccione...</option>

        </select>

    </div>

</section>

    <!-- Buscar -->

    <section class="busqueda">

        <i data-lucide="search"></i>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar estudiante...">

    </section>

    <!-- Lista -->

    <section
        class="lista-asistencia"
        id="listaAsistencia">

        <!-- Se cargará desde JavaScript -->

    </section>

    <!-- Resumen -->

    <section class="resumen">

        <div>

            <span>Presentes</span>

            <strong id="totalPresentes">0</strong>

        </div>

        <div>

            <span>Ausentes</span>

            <strong id="totalAusentes">0</strong>

        </div>

    </section>

    <!-- Guardar -->

    <button
        class="btn-guardar"
        id="guardarAsistencia">

        <i data-lucide="save"></i>

        Guardar asistencia

    </button>

</main>

<script src="js/auth.js"></script>
<script src="js/07_asistencia.js"></script>

<script>

    lucide.createIcons();

</script>

</body>

</html>
