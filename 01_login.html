<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | TallerControl</title>

    <!-- Estilos -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/01_login.css">

</head>

<body>

    <main class="login">

        <!-- Luces -->

        <div class="luz luz-1"></div>
        <div class="luz luz-2"></div>

        <!-- Tarjeta -->

        <section class="login-card">

            <!-- Logo -->

            <div class="logo">

                <img src="img/logo.png"
                     alt="Logo TallerControl">

            </div>

            <!-- Título -->

            <h1>Iniciar sesión</h1>

            <p>Asistencia de Taller - EPET N.º 6</p>

            <!-- Formulario -->

            <form>

                <!-- Usuario -->

                <div class="input-group">

                    <label for="usuario">

                        Usuario

                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario">

                </div>

                <!-- Contraseña -->

                <div class="input-group">

                    <label for="password">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña">

                </div>

                <!-- Botón -->

                <button
                    type="submit"
                    class="btn-primary">

                    Iniciar sesión

                </button>

            </form>

        </section>

    </main>

    <script src="js/01_login.js"></script>

</body>

</html>
