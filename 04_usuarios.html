<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Usuarios | TallerControl</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/04_usuarios.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <main class="usuarios">

        <!-- Luces -->

        <div class="luz luz-1"></div>
        <div class="luz luz-2"></div>

        <!-- Encabezado -->

        <header class="encabezado">

            <div class="titulo">

                <a href="02_inicio.html">

                    <i data-lucide="arrow-left"></i>

                </a>

                <h1>Usuarios</h1>

            </div>

            <div class="usuario-box">

                <div class="usuario-info">

                    <i data-lucide="user"></i>

                    <span id="nombreUsuario"></span>

                </div>

                <button
                    id="cerrarSesion"
                    class="btn-salir">

                    Salir

                </button>

            </div>

        </header>

        <!-- Buscar -->

        <section class="busqueda">

            <i data-lucide="search"></i>

            <input
                type="text"
                id="buscarUsuario"
                placeholder="Buscar usuario...">

        </section>

        <!-- Botón Nuevo -->

        <section class="acciones">

            <button
                class="btn-primary"
                id="btnNuevoUsuario">

                <i data-lucide="plus"></i>

                Nuevo usuario

            </button>

        </section>

        <!-- Lista -->

        <section
            class="lista-usuarios"
            id="listaUsuarios">

        </section>

        <!-- Pie -->

        <footer>

            Total de usuarios:
            <strong id="totalUsuarios">0</strong>

        </footer>

        <!-- Modal -->

        <div
            id="modalUsuario"
            class="modal oculto">

            <div class="modal-contenido">

                <h2 id="tituloModal">

                    Nuevo usuario

                </h2>

                <input
                    type="hidden"
                    id="usuarioId">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre">

                <input
                    type="text"
                    id="apellido"
                    placeholder="Apellido">

                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuario">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña">

                <select id="rol">

                    <option value="Administrador">

                        Administrador

                    </option>

                    <option value="Docente">

                        Docente

                    </option>

                </select>

                <div class="modal-botones">

                    <button id="guardarUsuario">

                        Guardar

                    </button>

                    <button id="cerrarModal">

                        Cancelar

                    </button>

                </div>

            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/04_usuarios.js"></script>

    <script>

        lucide.createIcons();

    </script>

</body>

</html>
